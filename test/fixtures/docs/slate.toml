[build]
source = "../notebooks"
output = "src/notebooks"
cache_dir = "slate_cache"
nworkers = 2
fail_on_error = true
allow_remote = false

[output]
format = "documenter"
interactivity = "frozen"
show_code = true
assets = "files"
provenance = true
downloads = ["html", "pdf", "source"]

[[notebook]]
path = "with_roles.jl"
title = "A Notebook With Roles"
order = 1

[[notebook]]
path = "_skip_me.jl"
skip = true
